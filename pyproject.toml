[project]
name = "embeds-support-copilot"
version = "0.1.0"
description = "Learning project for building a RAG-based support copilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-text-splitters>=1.0",
    "sentence-transformers>=5.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

